project:
  name: ReceiptKIE-VLM
  seed: 42

paths:
  dataset_root: data/raw/sroie/SROIE2019
  hf_cache: .cache/huggingface
  output_dir: artifacts/checkpoints/receipt-kie-lora
  log_file: artifacts/logs/training.log

model:
  model_id: HuggingFaceTB/SmolVLM-256M-Instruct
  trust_remote_code: false
  attention: auto
  precision: auto
  image_longest_edge: 512
  use_cache: false

training:
  num_train_epochs: 2
  max_steps: null
  max_seq_length: 512
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 0.0002
  weight_decay: 0.01
  warmup_ratio: 0.05
  logging_steps: 5
  save_strategy: steps
  save_steps: 50
  eval_strategy: steps
  eval_steps: 50
  save_total_limit: 2
  gradient_checkpointing: true
  dataloader_num_workers: 0
  train_limit: null
  eval_limit: 64

lora:
  rank: 16
  alpha: 32
  dropout: 0.05
  bias: none
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj

generation:
  max_new_tokens: 128
  do_sample: false
