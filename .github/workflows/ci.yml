name: Test and audit
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU test environment
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1 torchvision==0.20.1
          pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check src scripts tests
      - name: Unit and API contract tests (no GPU or model download)
        env:
          HF_HUB_OFFLINE: '1'
        run: pytest -q -p no:cacheprovider
      - name: Reproduce quality model from committed predictions
        run: python scripts/train_quality_gate.py --output-dir .cache/quality-reproduction
      - name: Check dependency compatibility
        run: pip check
