[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "receipt-kie-vlm"
version = "0.1.0"
description = "LoRA fine-tuning and evaluation for structured receipt key-information extraction."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["receipt_kie*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --basetemp=.pytest-tmp"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["research_notebooks", "*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM"]
